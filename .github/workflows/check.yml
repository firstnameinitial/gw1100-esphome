# SPDX-License-Identifier: GPL-3.0-only
name: Check firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host tests
        run: tests/run.sh
      - name: Install pinned ESPHome
        run: python -m pip install esphome==2026.7.4
      - name: Prepare example configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          source = Path('secrets.example.yaml').read_text()
          source = source.replace('BASE64_32_BYTE_KEY', base64.b64encode(bytes(32)).decode())
          Path('secrets.yaml').write_text(source)
          PY
      - name: Compile
        run: esphome compile gw1100.yaml
