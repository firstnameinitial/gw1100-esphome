# SPDX-License-Identifier: GPL-3.0-only
esphome:
  name: gw1100

esp8266:
  board: esp_wroom_02
  restore_from_flash: true

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "GW1100 Fallback"
    password: !secret fallback_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s

captive_portal:

time:
  - platform: sntp
    id: gw1100_time
    timezone: !secret timezone
    servers:
      - pool.ntp.org

logger:
  level: WARN

i2c:
  - id: i2c_bus
    sda: GPIO0
    scl: GPIO4
    scan: false

sensor:
  - platform: ecowitt_rf
    id: gw1100_rf
    i2c_id: i2c_bus
    time_id: gw1100_time
    device_type: 1
    ecowitt_ip: !secret ecowitt_ip
    ecowitt_path: !secret ecowitt_path
    ecowitt_port: 8123
    passkey: ""
    stationtype: "GW1100-ESPHome"
    freq: "868M"
    temperature:
      name: "GW1100 Indoor Temperature"
    humidity:
      name: "GW1100 Indoor Humidity"
    pressure:
      name: "GW1100 Pressure"
    outdoor_temperature:
      name: "GW1100 Outdoor Temperature"
    outdoor_humidity:
      name: "GW1100 Outdoor Humidity"
    wind_speed:
      name: "GW1100 Wind Speed"
    wind_direction:
      name: "GW1100 Wind Direction"
    wind_gust:
      name: "GW1100 Wind Gust"
    rain:
      name: "GW1100 Rain"
    rain_rate:
      name: "GW1100 Rain Rate"
    uv_index:
      name: "GW1100 UV Index"
    solar_radiation:
      name: "GW1100 Solar Radiation"
    soil_moisture:
      name: "GW1100 Soil Moisture"
    soil_temperature:
      name: "GW1100 Soil Temperature"
    soil_ec:
      name: "GW1100 Soil EC"
    pm25:
      name: "GW1100 PM2.5"
    pm10:
      name: "GW1100 PM10"
    co2:
      name: "GW1100 CO2"
    leaf_wetness:
      name: "GW1100 Leaf Wetness"
    lightning_strikes:
      name: "GW1100 Lightning Strikes"
    lightning_distance:
      name: "GW1100 Lightning Distance"
    leak:
      name: "GW1100 Leak"
    sensor_roster:
      name: "GW1100 Sensor Roster"
    device_info:
      name: "GW1100 Device Info"
    upload_switch: cfg_upload_enabled
    family_switches:
      - cfg_fam_0
      - cfg_fam_1
      - cfg_fam_2
      - cfg_fam_3
      - cfg_fam_4
      - cfg_fam_5
      - cfg_fam_6
      - cfg_fam_7
      - cfg_fam_8
      - cfg_fam_9
      - cfg_fam_10
      - cfg_fam_11

text:
  - platform: template
    name: "Upload Host"
    id: cfg_upload_host
    mode: text
    optimistic: true
    initial_value: !secret ecowitt_ip
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_host(x);'
  - platform: template
    name: "Upload Path"
    id: cfg_upload_path
    mode: text
    optimistic: true
    initial_value: !secret ecowitt_path
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_path(x);'
  - platform: template
    name: "Upload Passkey"
    id: cfg_upload_passkey
    mode: password
    optimistic: true
    initial_value: ""
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_passkey(x);'

number:
  - platform: template
    name: "Upload Port"
    id: cfg_upload_port
    min_value: 1
    max_value: 65535
    step: 1
    optimistic: true
    initial_value: 8123
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_port((uint16_t)x);'
  - platform: template
    name: "Upload Interval"
    id: cfg_upload_interval
    unit_of_measurement: "s"
    min_value: 5
    max_value: 300
    step: 1
    optimistic: true
    initial_value: 16
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_interval((uint16_t)x);'
  - platform: template
    name: "Calibration Temperature Offset"
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    optimistic: true
    initial_value: 0
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_temp(x);'
  - platform: template
    name: "Calibration Humidity Offset"
    unit_of_measurement: "%"
    min_value: -20
    max_value: 20
    step: 1
    optimistic: true
    initial_value: 0
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_hum(x);'
  - platform: template
    name: "Calibration Pressure Offset"
    unit_of_measurement: "hPa"
    min_value: -50
    max_value: 50
    step: 0.1
    optimistic: true
    initial_value: 0
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_press(x);'
  - platform: template
    name: "Calibration Rain Gain"
    min_value: 0.5
    max_value: 1.5
    step: 0.01
    optimistic: true
    initial_value: 1
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_rain(x);'
  - platform: template
    name: "Calibration Wind Gain"
    min_value: 0.5
    max_value: 1.5
    step: 0.01
    optimistic: true
    initial_value: 1
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_wind(x);'
  - platform: template
    name: "Calibration Solar Gain"
    min_value: 0.5
    max_value: 1.5
    step: 0.01
    optimistic: true
    initial_value: 1
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_solar(x);'
  - platform: template
    name: "Calibration UV Gain"
    min_value: 0.5
    max_value: 1.5
    step: 0.1
    optimistic: true
    initial_value: 1
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cal_uv(x);'

select:
  - platform: template
    name: "Timezone"
    id: cfg_timezone
    optimistic: true
    initial_option: !secret timezone
    options:
      - "Europe/London"
      - "Europe/Berlin"
      - "Europe/Paris"
      - "Europe/Amsterdam"
      - "Europe/Madrid"
      - "Europe/Rome"
      - "UTC"
      - "America/New_York"
      - "America/Los_Angeles"
      - "Australia/Sydney"
      - "Asia/Tokyo"
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_timezone(x);'
  - platform: template
    name: "RF Band"
    id: cfg_band
    optimistic: true
    initial_option: "868 MHz"
    options:
      - "433 MHz"
      - "868 MHz"
      - "915 MHz"
      - "920 MHz"
    on_value:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_band(x == "868 MHz" ? 1 : x == "915 MHz" ? 2 : x == "920 MHz" ? 3 : 0);'

switch:
  - platform: template
    name: "Upload Enabled"
    id: cfg_upload_enabled
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_upload_enabled(true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_cfg_upload_enabled(false);'
  - platform: template
    name: "Enable Indoor T/H/P (WH25/WH32)"
    id: cfg_fam_0
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(0, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(0, false);'
  - platform: template
    name: "Enable Outdoor T/H (WH31)"
    id: cfg_fam_1
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(1, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(1, false);'
  - platform: template
    name: "Enable Soil Moisture (WH51)"
    id: cfg_fam_2
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(2, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(2, false);'
  - platform: template
    name: "Enable Soil Temperature (WN34/WN38)"
    id: cfg_fam_3
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(3, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(3, false);'
  - platform: template
    name: "Enable Soil EC (WH52)"
    id: cfg_fam_4
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(4, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(4, false);'
  - platform: template
    name: "Enable Weather Array (WH24/WH65/WS69)"
    id: cfg_fam_5
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(5, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(5, false);'
  - platform: template
    name: "Enable Rain Gauge (WH40/WN20)"
    id: cfg_fam_6
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(6, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(6, false);'
  - platform: template
    name: "Enable Ultrasonic Array (WS68/WS80/WS85/WS90)"
    id: cfg_fam_7
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(7, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(7, false);'
  - platform: template
    name: "Enable Air Quality (WH0290/WH43/WH45/WH46)"
    id: cfg_fam_8
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(8, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(8, false);'
  - platform: template
    name: "Enable Lightning (WH57)"
    id: cfg_fam_9
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(9, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(9, false);'
  - platform: template
    name: "Enable Leak (WH55/WH54)"
    id: cfg_fam_10
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(10, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(10, false);'
  - platform: template
    name: "Enable Leaf Wetness (WH35)"
    id: cfg_fam_11
    optimistic: true
    restore_mode: DISABLED
    on_turn_on:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(11, true);'
    on_turn_off:
      then:
        - lambda: 'id(gw1100_rf)->set_family_enabled(11, false);'
